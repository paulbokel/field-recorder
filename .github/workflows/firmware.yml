# Builds the firmware on every push. A tag like v1.2.0 also publishes a GitHub release with
# firmware.bin + manifest.json, which devices pick up by themselves (Settings > Firmware).
name: Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - run: pip install platformio

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must look like v1.2.3"; exit 1; }
          else
            V="$(sed -n 's/.*#define FW_VERSION "\(.*\)".*/\1/p' src/config.h)-dev"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          PLATFORMIO_BUILD_FLAGS: -DFW_VERSION=\"${{ steps.v.outputs.version }}\"
        run: pio run

      - name: Collect
        run: |
          B=.pio/build/field-recorder
          mkdir out
          cp $B/firmware.bin $B/bootloader.bin $B/partitions.bin out/
          SIZE=$(stat -c %s out/firmware.bin)
          [ "$SIZE" -le 2097152 ] || { echo "::error::firmware.bin is $SIZE bytes, the app slot is 2 MB"; exit 1; }
          NOTES=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME" 2>/dev/null | head -1)
          jq -n --arg v "${{ steps.v.outputs.version }}" --argjson s "$SIZE" --arg n "$NOTES" \
            '{version: $v, size: $s, notes: $n}' > out/manifest.json
          cat out/manifest.json
          echo "### firmware.bin: $SIZE of 2097152 bytes ($((SIZE * 100 / 2097152))%)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.v.outputs.version }}
          path: out/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/firmware.bin
            out/manifest.json
            out/bootloader.bin
            out/partitions.bin
          generate_release_notes: true
